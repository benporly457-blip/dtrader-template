<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="100%" height="100%">
  <defs>
    <!-- Anthex Glowing Emerald Gradient -->
    <linearGradient id="anthex-emerald-full" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="emerald-glow-full" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Mark -->
  <g transform="translate(0, 0)">
    <rect x="8" y="8" width="64" height="64" rx="18" fill="none" stroke="url(#anthex-emerald-full)" stroke-width="4" filter="url(#emerald-glow-full)" />
    <path d="M 24 50 L 36 38 L 44 46 L 56 26 M 48 26 L 56 26 L 56 34" fill="none" stroke="url(#anthex-emerald-full)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography matching banner -->
  <text x="92" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" letter-spacing="5" fill="#FFFFFF">ANTH<tspan fill="url(#anthex-emerald-full)">EX</tspan></text>
</svg>
